[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/AsyncTCP@3.5.0
board_build.filesystem = littlefs
build_flags =
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<commands.cpp> -<servo_bus.cpp> -<calibration_store.cpp> -<power_monitor_hw.cpp> -<servo_output_hw.cpp> -<status_led.cpp> -<imu_hw.cpp> -<web.cpp>
